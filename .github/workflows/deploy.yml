name: Deploy to Cloudflare Workers

on:
  push:
    # 本仓库默认分支是 master（不是 main）——之前写成 main 导致这个
    # workflow 从来没有触发过一次（Actions 历史 0 条运行记录）
    branches: [master, main]
  # 手动触发入口，随时可以在 Actions 页面点 Run workflow 强制部署一次
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # wrangler 4.107 要求 Node ≥ 22（20 会在 secret/deploy 时直接退出并提示装 nvm），
          # 直接上 24（当前 LTS，也是 GitHub Actions runner 的默认版本）
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # 部署前先做语法检查，拦住"引用了不存在的函数/列"这类低级错误里能静态发现的部分
      - name: Syntax check
        run: |
          node --check worker.js
          node --check public/app.js
          node --check public/map.js

      # KV namespace 自动供给：只在 wrangler.toml 里还是占位符时触发（全新账号/fork 首次部署），
      # 先按标题查已有 namespace，没有才创建，拿到 id 后 sed 进本次构建的 wrangler.toml
      # （不改仓库文件）。幂等——重复跑不会重复建。已填真实 id 时这步直接跳过。
      # 需要 API Token 带 "Workers KV Storage:Edit" 权限
      - name: Provision KV namespace (first deploy only)
        run: |
          if ! grep -q "REPLACE_WITH_KV_NAMESPACE_ID" wrangler.toml; then
            echo "wrangler.toml 已配置 KV id，跳过"
            exit 0
          fi
          TITLE="memories-today-MEMORIES_KV"
          ID=$(npx wrangler kv namespace list 2>/dev/null | sed -n '/^\[/,$p' | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .id' | head -1)
          if [ -z "$ID" ]; then
            echo "创建 KV namespace: $TITLE"
            npx wrangler kv namespace create MEMORIES_KV
            ID=$(npx wrangler kv namespace list 2>/dev/null | sed -n '/^\[/,$p' | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .id' | head -1)
          else
            echo "复用已有 KV namespace: $ID"
          fi
          if [ -z "$ID" ]; then
            echo "::error::KV namespace 创建/查询失败，检查 API Token 是否有 Workers KV Storage:Edit 权限"
            exit 1
          fi
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/$ID/" wrangler.toml
          echo "已写入 KV namespace id: $ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Workers 付费版对打包后脚本的硬限制是 gzip 10MB，public/ 静态资源走
      # Static Assets 不计入。这里卡 1MB 预警线（硬限制的 1/10，当前实际约 30KB）：
      # 一旦 worker.js 或它 import 的 npm 依赖把打包体积推过线就拦下部署，
      # 提前暴露体积异常增长，而不是等逼近 10MB 才发现
      - name: Worker bundle size check (gzip ≤ 1MB)
        run: |
          npx wrangler deploy --dry-run --outdir /tmp/wrk-dist
          SIZE=$(gzip -c /tmp/wrk-dist/worker.js | wc -c)
          echo "bundled worker.js gzip size: ${SIZE} bytes ($((SIZE / 1024)) KiB)"
          if [ "$SIZE" -gt 1048576 ]; then
            echo "::error::Worker 打包后 gzip ${SIZE}B 超过 1MB 预警线"
            exit 1
          fi

      # command: deploy 强制用 wrangler deploy（非 versions upload），DO migrations 必须走这条路（error 10211）。
      # 必须锁 wrangler 4：action 自带的 3.90.0 不认识 [images] 配置段，只警告不报错，
      # 部署出来的 Worker 直接丢掉 IMAGES 绑定（env.IMAGES undefined，缩略图转 WebP 全挂）。
      # 版本跟 package.json devDependencies 保持一致。
      # 注意：secrets 同步放在 deploy 之后的独立步骤——wrangler-action 的 secrets 输入会在
      # deploy 前执行 secret bulk，一旦别的来源（比如 Cloudflare Build 的 versions upload）
      # 传过未部署的版本，Cloudflare 会用 10215 拒绝改 secret，整个 workflow 直接失败。
      # 先 deploy 保证"最新版本=已部署"，再 bulk 就不会撞上这个限制
      - name: Deploy Worker + Static Assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.107.0"
          command: deploy

      # Secret 是持久的：deploy 不会清掉已设置的 secret，这步只是把 GitHub Secrets 的最新值
      # 同步过去，绝大多数时候是幂等空转。同理，这里不发某个 key 也不会把它删掉——
      # ADMIN_TOKEN 就是这么移出列表的：worker.js 已经一处都不再读它（整站挡在
      # Cloudflare Access 后面，管理端点不再单独校验 token），留着只会让每个照文档
      # 配置的人白配一个 secret，而已经设进 Worker 的那份不受影响。
      # 只要 Cloudflare Build 的 Git 连接还没断开，它的"非生产分支构建"随时会传未部署
      # 版本触发 10215 拒绝——那不影响本次部署的正确性，
      # 所以 continue-on-error：同步得上就同步，同步不上不拉红整个 workflow
      - name: Sync secrets
        continue-on-error: true
        run: |
          jq -n '{TELEGRAM_BOT_TOKEN: env.TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID: env.TELEGRAM_CHAT_ID}' \
            | npx wrangler secret bulk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
