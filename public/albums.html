<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>相簿 · 那年今日</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="preload" href="/vendor/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
<style>
@font-face {
  font-family: 'Space Grotesk';
  font-style: normal;
  font-weight: 300 700;
  font-display: swap;
  src: url('/vendor/space-grotesk-latin.woff2') format('woff2');
}
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #04040c;
  color: #f5f5f7;
  font-family: "SF Pro Display", -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  min-height: 100dvh;
}
header {
  padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) 1rem max(1.5rem, env(safe-area-inset-left));
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(4,4,12,0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  gap: 1rem;
}
.back-btn {
  width: 34px; height: 34px; border-radius: 50%; border: none;
  background: rgba(255,255,255,0.08); color: #f5f5f7;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; text-decoration: none; flex-shrink: 0;
  transition: background 0.15s;
}
.back-btn:hover { background: rgba(255,255,255,0.15); }
.back-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.admin-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255,255,255,0.06); color: #8a8a8f;
  display: flex; align-items: center; justify-content: center;
  text-decoration: none; flex-shrink: 0;
  transition: background 0.15s, color 0.15s;
}
.admin-btn:hover { background: rgba(255,255,255,0.13); color: #f5f5f7; }
.admin-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
h1 { margin: 0; font-size: 1.15rem; font-weight: 700; flex: 1; }
main {
  max-width: 960px;
  margin: 0 auto;
  padding: 1.5rem max(1.2rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1.2rem, env(safe-area-inset-left));
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1rem;
}
.album-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  display: block;
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s;
}
.album-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 36px rgba(0,0,0,0.55);
  border-color: rgba(255,255,255,0.15);
}
.album-cover {
  width: 100%;
  aspect-ratio: 4/3;
  background: #0a0a14;
  overflow: hidden;
  position: relative;
}
.album-cover img {
  width: 100%; height: 100%; object-fit: cover;
  opacity: 0; transition: opacity 0.3s ease;
}
.album-cover img.loaded { opacity: 1; }
.album-cover-placeholder {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem; color: rgba(255,255,255,0.15);
}
.album-body { padding: 0.75rem 0.9rem 0.9rem; }
.album-title { font-size: 0.92rem; font-weight: 700; line-height: 1.3; margin-bottom: 0.2rem; }
.album-desc { font-size: 0.72rem; color: #8a8a8f; line-height: 1.45; margin-bottom: 0.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.album-meta { display: flex; align-items: center; gap: 0.4rem; font-size: 0.68rem; color: #6a6a6f; font-family: 'Space Grotesk', sans-serif; }
.album-lock { display: inline-flex; align-items: center; gap: 0.2rem; padding: 0.1rem 0.45rem; border-radius: 999px; background: rgba(255,180,0,0.15); color: #ffbb33; font-size: 0.65rem; }
.album-lock svg { width: 10px; height: 10px; fill: currentColor; stroke: none; }
.empty { text-align: center; color: #6a6a6f; padding: 4rem 1rem; font-size: 0.9rem; }

/* Password overlay */
.pw-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  align-items: center; justify-content: center;
}
.pw-overlay.open { display: flex; }
.pw-card {
  background: rgba(18,18,24,0.97);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 18px;
  padding: 1.8rem;
  width: min(340px, 92vw);
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
}
.pw-card h3 { margin: 0 0 0.3rem; font-size: 1.05rem; }
.pw-card p { margin: 0 0 1rem; color: #8a8a8f; font-size: 0.8rem; }
.pw-card input {
  width: 100%; padding: 0.6rem 0.8rem;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px; color: #f5f5f7; font-size: 0.9rem; outline: none;
  margin-bottom: 0.75rem;
}
.pw-card input:focus { border-color: rgba(255,255,255,0.35); }
.pw-actions { display: flex; gap: 0.6rem; justify-content: flex-end; }
.pw-actions button {
  padding: 0.45rem 1rem; border-radius: 8px; border: none;
  font-size: 0.85rem; font-weight: 600; cursor: pointer;
}
.pw-cancel { background: rgba(255,255,255,0.08); color: #f5f5f7; }
.pw-submit { background: #3a82f7; color: #fff; }
.pw-err { color: #ff3b30; font-size: 0.78rem; margin: -0.4rem 0 0.6rem; display: none; }
.pw-err.show { display: block; }
</style>
</head>
<body>
<header>
  <a class="back-btn" href="/" title="回到今天">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <h1>相簿</h1>
  <a class="admin-btn" href="/admin/albums" title="管理相簿">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </a>
</header>

<main>
  <div class="grid" id="albumGrid">
    <div class="empty">加载中…</div>
  </div>
</main>

<!-- Password prompt -->
<div class="pw-overlay" id="pwOverlay">
  <div class="pw-card">
    <h3>🔒 私密相簿</h3>
    <p id="pwAlbumTitle"></p>
    <input type="password" id="pwInput" placeholder="请输入密码" autocomplete="off" />
    <div class="pw-err" id="pwErr">密码错误，请重试</div>
    <div class="pw-actions">
      <button class="pw-cancel" onclick="closePw()">取消</button>
      <button class="pw-submit" onclick="submitPw()">确认</button>
    </div>
  </div>
</div>

<script>
var _pendingSlug = null;
var _pendingTitle = null;

function loadAlbums() {
  fetch('/api/albums').then(function(r){ return r.json(); }).then(function(data) {
    var grid = document.getElementById('albumGrid');
    if (!data.albums || !data.albums.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1">还没有相簿</div>';
      return;
    }
    grid.innerHTML = data.albums.map(function(a) {
      var cover = a.coverUrl
        ? '<img src="'+a.coverUrl+'" alt="" onload="this.classList.add(\'loaded\')" />'
        : '';
      var lock = a.isPrivate
        ? '<span class="album-lock"><svg viewBox="0 0 24 24"><path d="M18 11H6a2 2 0 00-2 2v7a2 2 0 002 2h12a2 2 0 002-2v-7a2 2 0 00-2-2z"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>私密</span>'
        : '';
      var desc = a.description ? '<div class="album-desc">'+escHtml(a.description)+'</div>' : '';
      return '<a class="album-card" href="#" onclick="openAlbum(event,'+JSON.stringify(a.slug)+','+JSON.stringify(a.title)+','+a.isPrivate+')">' +
        '<div class="album-cover"><div class="album-cover-placeholder">🖼</div>'+cover+'</div>' +
        '<div class="album-body">' +
          '<div class="album-title">'+escHtml(a.title)+'</div>' +
          desc +
          '<div class="album-meta">'+lock+'</div>' +
        '</div>' +
        '</a>';
    }).join('');
  }).catch(function() {
    document.getElementById('albumGrid').innerHTML = '<div class="empty" style="grid-column:1/-1;color:#ff3b30">加载失败，请刷新重试</div>';
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openAlbum(e, slug, title, isPrivate) {
  e.preventDefault();
  if (isPrivate) {
    _pendingSlug = slug;
    _pendingTitle = title;
    document.getElementById('pwAlbumTitle').textContent = '「' + title + '」需要密码才能查看';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwErr').classList.remove('show');
    document.getElementById('pwOverlay').classList.add('open');
    setTimeout(function() { document.getElementById('pwInput').focus(); }, 50);
  } else {
    goToAlbum(slug, '');
  }
}

function closePw() {
  document.getElementById('pwOverlay').classList.remove('open');
  _pendingSlug = null;
}

function submitPw() {
  var pw = document.getElementById('pwInput').value;
  if (!pw || !_pendingSlug) return;
  // Verify password by calling API with x-album-password header
  fetch('/api/albums/' + _pendingSlug, { headers: { 'x-album-password': pw } })
    .then(function(r) {
      if (r.status === 401) {
        document.getElementById('pwErr').classList.add('show');
        document.getElementById('pwInput').value = '';
        document.getElementById('pwInput').focus();
        return;
      }
      if (r.ok) {
        document.getElementById('pwOverlay').classList.remove('open');
        goToAlbum(_pendingSlug, pw);
      }
    });
}

function goToAlbum(slug, pw) {
  var url = '/?album=' + encodeURIComponent(slug);
  if (pw) url += '&pw=' + encodeURIComponent(pw);
  location.href = url;
}

document.getElementById('pwInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') submitPw();
});

loadAlbums();
</script>
</body>
</html>
