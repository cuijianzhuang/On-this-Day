<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>那年今日</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<!-- use-credentials：manifest 请求默认不带 Cookie，站点在 Cloudflare Access 后面时会被打回登录页（CORS 报错），带上凭证才能过 -->
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="那年今日" />
<link rel="apple-touch-icon" href="/app-icon?size=180" />
<!-- 字体自托管（可变字体一个文件覆盖 400-600 字重）；heic2any 也不再页面加载时引入，
     app.js 里第一次需要浏览器端解码 HEIC 时才动态注入——国内访问不再依赖 Google/jsDelivr 两个不稳的境外 CDN -->
<link rel="preload" href="/vendor/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="sunlight">
    <div class="glow"></div>
    <div class="video-layer">
      <video id="leafVideo" autoplay muted loop playsinline>
        <source src="https://image.cuijianzhuang.com/leaves.mp4" type="video/mp4" />
      </video>
    </div>
  </div>
  <div class="sun-sweep" id="sunSweep"></div>
  <header>
    <div class="eyebrow">回忆 · Memories</div>
    <h1 id="title">那年今日</h1>
    <div class="subtitle" id="subtitle">正在唤醒回忆</div>
    <div class="daily-poem" id="dailyPoem"></div>
    <!-- 历史上的今天（Wikimedia）：默认折叠，点开看正在浏览那一天的世界大事记 -->
    <div class="otd" id="otdBlock" hidden>
      <button class="otd-toggle" id="otdToggle" type="button"><span class="otd-ticker-text" id="otdTicker">🕰 历史上的今天</span><span class="otd-arrow">▾</span></button>
      <div class="otd-list" id="otdList" hidden></div>
    </div>
    <div class="header-controls">
      <div class="sunlight-switch">
        <span id="sunlightLabel">LET THE SUN IN</span>
        <label class="switch">
          <input type="checkbox" id="sunlightSwitch" checked />
          <span class="track"></span>
        </label>
      </div>
      <a class="date-toggle" href="/recap" id="recapLink" title="年度回忆放映">
        <svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20"/></svg>
      </a>
      <a class="date-toggle" href="/loved" id="lovedLink" title="全家最爱">
        <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      </a>
      <a class="date-toggle" href="/albums" id="albumsLink" title="相簿">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="7" width="4" height="4" rx="1"/><rect x="13" y="7" width="4" height="4" rx="1"/><rect x="7" y="13" width="4" height="4" rx="1"/><rect x="13" y="13" width="4" height="4" rx="1"/></svg>
      </a>
      <a class="date-toggle" href="/map" id="mapLink" title="看看拍照的地方">
        <svg viewBox="0 0 24 24"><path d="M9 18l-5 2V4l5-2 6 2 5-2v16l-5 2-6-2z"/><line x1="9" y1="2" x2="9" y2="18"/><line x1="15" y1="4" x2="15" y2="20"/></svg>
      </a>
      <button class="calendar-mode-toggle" id="lunarToggle" type="button" aria-pressed="false" title="切换公历 / 农历">
        <span class="calendar-mode-option solar">公</span><span class="calendar-mode-option lunar">农</span>
      </button>
      <button class="date-toggle" id="yearToggle" title="跳到某一年" disabled>
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="8.2" cy="14" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="14" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.8" cy="14" r="1.1" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="date-toggle" id="dateToggle" title="查看某一天">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
      </button>
      <button class="date-toggle" id="searchToggle" title="搜索照片">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
      </button>
    </div>
    <div class="year-menu" id="yearMenu"></div>
    <div class="search-panel" id="searchPanel">
      <input type="search" id="searchInput" placeholder="搜内容或地点：海边 / 蛋糕 / 北京…" autocomplete="off" />
      <div class="search-results" id="searchResults"></div>
    </div>
    <audio id="ambientAudio" loop preload="none">
      <source src="https://image.cuijianzhuang.com/forest.mp3" type="audio/mpeg" />
    </audio>
    <div class="date-picker" id="datePicker">
      <div class="cal-header">
        <button class="cal-nav-btn" id="calPrevMonth" type="button">‹</button>
        <span class="cal-month-label" id="calMonthLabel"></span>
        <button class="cal-nav-btn" id="calNextMonth" type="button">›</button>
      </div>
      <div class="cal-weekdays">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="row">
        <a class="action-btn" id="datePickerToday" href="/">回到今天</a>
      </div>
    </div>
  </header>
  <div id="fingertip"></div>
  <div id="cursorDot">
    <span class="br tl"></span>
    <span class="br tr"></span>
    <span class="br bl"></span>
    <span class="br brc"></span>
    <span class="center-dot"></span>
  </div>
  <div id="content">
    <div class="skeleton-grid">
      <div class="cell" style="width:150px;--tilt-deg:-3;--sway-dur:4.0s;--sway-delay:0.0s;--enter-delay:0.00s;"><div class="frame-inner"></div></div>
      <div class="cell" style="width:190px;--tilt-deg:-1.5;--sway-dur:4.7s;--sway-delay:0.5s;--enter-delay:0.05s;"><div class="frame-inner"></div></div>
      <div class="cell" style="width:230px;--tilt-deg:0;--sway-dur:5.4s;--sway-delay:1.0s;--enter-delay:0.10s;"><div class="frame-inner"></div></div>
      <div class="cell" style="width:170px;--tilt-deg:1.5;--sway-dur:6.1s;--sway-delay:1.5s;--enter-delay:0.15s;"><div class="frame-inner"></div></div>
      <div class="cell" style="width:210px;--tilt-deg:3;--sway-dur:4.0s;--sway-delay:2.0s;--enter-delay:0.20s;"><div class="frame-inner"></div></div>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-inner">
      <span class="lightbox-nav prev" id="navPrev">‹</span>
      <span class="lightbox-nav next" id="navNext">›</span>
      <div class="lightbox-stage">
        <div class="lightbox-actions">
          <div class="lb-live-bar" id="lbLiveBar"></div>
          <span class="lightbox-btn" id="lightboxInfo" title="详细信息">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r="0.5" fill="currentColor"/></svg>
          </span>
          <a class="lightbox-btn" id="lightboxShare" title="分享">
            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
          </a>
          <a class="lightbox-btn" id="lightboxDownload" title="下载">
            <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          </a>
          <span class="lightbox-btn close" id="lightboxClose" title="关闭">
            <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
          </span>
        </div>
        <div class="lb-scale-badge" id="lbScaleBadge"></div>
        <div class="lb-load-progress" id="lbLoadProgress"></div>
        <div id="lightboxBody"></div>
        <div class="lb-bottom-bar" id="lbBottomBar">
          <div class="lb-zoom-hint" id="lbZoomHint"></div>
          <div class="lb-react-wrap" id="lbReactWrap">
            <div class="lb-emoji-popup" id="lbEmojiPopup"></div>
            <button class="lb-react-btn" id="lbReactBtn">
              <span class="lb-react-icon">😊</span>
              <span class="lb-react-label">表态</span>
              <span class="lb-react-count" id="lbReactCount"></span>
            </button>
          </div>
        </div>
      </div>
      <aside class="lightbox-panel" id="lightboxPanel">
        <div class="lp-filename" id="lpFilename"></div>
        <div class="lp-reactions" id="lpReactions"></div>
        <div class="lp-section" id="lpInfo"></div>
        <div class="lp-section lp-exif-wrap" id="lpExif"></div>
      </aside>
    </div>
    <div class="lightbox-filmstrip" id="lightboxFilmstrip"></div>
  </div>
  <div class="toast" id="toast"></div>
  <button class="back-to-top" id="backToTop" title="回到顶部">
    <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
  </button>

<div class="online-badge" id="onlineBadge" style="display:none">
  <div class="online-avatars" id="onlineAvatars"></div>
  <span class="online-label" id="onlineLabel"></span>
</div>
<script src="/app.js" defer></script>
</body>
</html>
