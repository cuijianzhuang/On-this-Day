<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>那年今日</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<!-- use-credentials：manifest 请求默认不带 Cookie，站点在 Cloudflare Access 后面时会被打回登录页（CORS 报错），带上凭证才能过 -->
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
<meta name="theme-color" content="#0e0d0b" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="那年今日" />
<link rel="apple-touch-icon" href="/app-icon?size=180" />
<!-- 字体自托管（可变字体一个文件覆盖 400-600 字重）；heic2any 也不再页面加载时引入，
     app.js 里第一次需要浏览器端解码 HEIC 时才动态注入——国内访问不再依赖 Google/jsDelivr 两个不稳的境外 CDN -->
<link rel="preload" href="/vendor/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
<!-- 缩略图全部 302 跳到 previews 域、背景视频/音频在 image 域——提前握手，首屏图片省一次 DNS+TLS 往返 -->
<link rel="preconnect" href="https://previews.cuijianzhuang.com" />
<link rel="preconnect" href="https://image.cuijianzhuang.com" />
<link rel="stylesheet" href="/ui.css" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="sunlight">
    <div class="glow"></div>
    <div class="video-layer">
      <!-- 不再 autoplay 全量下载：src 由 app.js 在首屏照片开始加载后再挂上，不跟缩略图抢首屏带宽 -->
      <video id="leafVideo" muted loop playsinline preload="none" data-src="https://image.cuijianzhuang.com/leaves.mp4"></video>
    </div>
  </div>
  <div class="sun-sweep" id="sunSweep"></div>
  <div class="topbar-bg" aria-hidden="true"></div>
  <header>
    <div class="eyebrow">On This Day · 那年今日</div>
    <h1 id="title">那年今日</h1>
    <div class="subtitle" id="subtitle">正在唤醒回忆</div>
    <div class="daily-poem" id="dailyPoem"></div>
    <!-- 纪念日提醒：命中当天或临近的手动纪念日（生日/结婚纪念日…），跟浏览哪天无关，只看真实"今天" -->
    <div class="anniv-banner" id="annivBanner" hidden></div>
    <!-- 历史上的今天（Wikimedia）：默认折叠，点开看正在浏览那一天的世界大事记 -->
    <div class="otd" id="otdBlock" hidden>
      <button class="otd-toggle" id="otdToggle" type="button"><span class="otd-ticker-text" id="otdTicker">🕰 历史上的今天</span><span class="otd-arrow">▾</span></button>
      <div class="otd-list" id="otdList" hidden></div>
    </div>
    <!-- 右上角工具栏：阳光开关 | 公/农历 | 跳到某年、选日期、搜索、更多功能。
         四个下拉面板的开关统一由 app.js 的 bindHeaderMenu 管（同一时间只开一个、点外面/Esc 关闭、
         按钮随面板高亮并同步 aria-expanded） -->
    <div class="header-controls">
      <div class="toolbar" role="toolbar" aria-label="页面工具">
        <label class="icon-btn sun-btn" id="sunlightBtn" title="关掉阳光">
          <input type="checkbox" id="sunlightSwitch" class="sr-only" checked />
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="sr-only" id="sunlightLabel">阳光</span>
        </label>
        <button class="calendar-mode-toggle" id="lunarToggle" type="button" aria-pressed="false" title="切换公历 / 农历">
          <span class="calendar-mode-option solar">公</span><span class="calendar-mode-option lunar">农</span>
        </button>
        <span class="tb-sep" aria-hidden="true"></span>
        <button class="icon-btn" id="yearToggle" type="button" title="跳到某一年" aria-label="跳到某一年" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"/></svg></button>
        <button class="icon-btn" id="dateToggle" type="button" title="选择日期" aria-label="选择日期"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg></button>
        <button class="icon-btn" id="searchToggle" type="button" title="搜索照片" aria-label="搜索照片"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg></button>
        <button class="icon-btn" id="navMenuToggle" type="button" title="更多" aria-label="更多功能"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
      </div>
    </div>
    <div class="nav-menu popover menu" id="navMenu" role="menu">
      <a class="menu-item" role="menuitem" href="/recap"><span class="mi-icon"><svg viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20"/></svg></span><span class="mi-text"><span class="mi-title">年度回忆放映</span><span class="mi-sub">一年的精选，自动播放</span></span></a>
      <a class="menu-item" role="menuitem" href="/loved"><span class="mi-icon"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></span><span class="mi-text"><span class="mi-title">全家最爱</span><span class="mi-sub">大家点赞最多的照片</span></span></a>
      <a class="menu-item" role="menuitem" href="/map" id="mapLink"><span class="mi-icon"><svg viewBox="0 0 24 24"><path d="M9 18l-5 2V4l5-2 6 2 5-2v16l-5 2-6-2z"/><line x1="9" y1="2" x2="9" y2="18"/><line x1="15" y1="4" x2="15" y2="20"/></svg></span><span class="mi-text"><span class="mi-title">足迹地图</span><span class="mi-sub">这一天去过的地方</span></span></a>
      <a class="menu-item" role="menuitem" href="/stats"><span class="mi-icon"><svg viewBox="0 0 24 24"><line x1="5" y1="20" x2="5" y2="11"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="19" y1="20" x2="19" y2="14"/></svg></span><span class="mi-text"><span class="mi-title">数据总览</span><span class="mi-sub">这些年一共拍了多少</span></span></a>
      <div class="menu-sep" role="separator"></div>
      <a class="menu-item" role="menuitem" href="/admin/ops"><span class="mi-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span><span class="mi-text"><span class="mi-title">运维控制台</span></span></a>
    </div>
    <div class="year-menu popover menu" id="yearMenu" role="menu"></div>
    <div class="search-panel popover" id="searchPanel">
      <label class="search-field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
        <input type="search" id="searchInput" placeholder="搜内容或地点：海边 / 蛋糕 / 北京…" autocomplete="off" aria-label="搜索照片" />
      </label>
      <div class="search-results" id="searchResults"></div>
    </div>
    <audio id="ambientAudio" loop preload="none">
      <source src="https://image.cuijianzhuang.com/forest.mp3" type="audio/mpeg" />
    </audio>
    <div class="date-picker popover" id="datePicker">
      <div class="cal-header">
        <button class="icon-btn cal-nav-btn" id="calPrevMonth" type="button" aria-label="上个月"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
        <span class="cal-month-label" id="calMonthLabel"></span>
        <button class="icon-btn cal-nav-btn" id="calNextMonth" type="button" aria-label="下个月"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
      </div>
      <div class="cal-weekdays">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="row">
        <a class="pill-btn" id="datePickerToday" href="/">回到今天</a>
      </div>
    </div>
  </header>
  <div id="content">
    <div class="skeleton-grid">
      <div class="cell hero"><div class="frame-inner"></div></div>
      <div class="cell" style="--ar:1.5"><div class="frame-inner"></div></div>
      <div class="cell" style="--ar:0.75"><div class="frame-inner"></div></div>
      <div class="cell" style="--ar:1.333"><div class="frame-inner"></div></div>
      <div class="cell" style="--ar:1.333"><div class="frame-inner"></div></div>
      <div class="cell" style="--ar:0.75"><div class="frame-inner"></div></div>
      <div class="cell" style="--ar:1.5"><div class="frame-inner"></div></div>
      <div class="cell" style="--ar:1.333"><div class="frame-inner"></div></div>
    </div>
  </div>
  <div class="lightbox" id="lightbox">
    <div class="lightbox-inner">
      <button class="icon-btn glass lightbox-nav prev" id="navPrev" type="button" aria-label="上一张"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <button class="icon-btn glass lightbox-nav next" id="navNext" type="button" aria-label="下一张"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
      <div class="lightbox-stage">
        <div class="lightbox-actions">
          <div class="lb-live-bar" id="lbLiveBar"></div>
          <span class="icon-btn glass lightbox-btn" id="lightboxInfo" title="详细信息" role="button" tabindex="0" aria-label="详细信息">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r="0.5" fill="currentColor"/></svg>
          </span>
          <a class="icon-btn glass lightbox-btn" id="lightboxShare" title="分享" aria-label="分享">
            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
          </a>
          <a class="icon-btn glass lightbox-btn" id="lightboxDownload" title="下载" aria-label="下载">
            <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          </a>
          <span class="icon-btn glass lightbox-btn close" id="lightboxClose" title="关闭" role="button" tabindex="0" aria-label="关闭">
            <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
          </span>
        </div>
        <div class="lb-scale-badge" id="lbScaleBadge"></div>
        <div class="lb-load-progress" id="lbLoadProgress"></div>
        <div id="lightboxBody"></div>
        <div class="lb-bottom-bar" id="lbBottomBar">
          <div class="lb-zoom-hint" id="lbZoomHint"></div>
          <div class="lb-react-wrap" id="lbReactWrap">
            <div class="lb-emoji-popup" id="lbEmojiPopup"></div>
            <button class="lb-react-btn" id="lbReactBtn">
              <span class="lb-react-icon">😊</span>
              <span class="lb-react-label">表态</span>
              <span class="lb-react-count" id="lbReactCount"></span>
            </button>
          </div>
        </div>
      </div>
      <aside class="lightbox-panel" id="lightboxPanel">
        <div class="lp-filename" id="lpFilename"></div>
        <div class="lp-reactions" id="lpReactions"></div>
        <div class="lp-section" id="lpInfo"></div>
        <div class="lp-section lp-exif-wrap" id="lpExif"></div>
      </aside>
    </div>
    <div class="lightbox-filmstrip" id="lightboxFilmstrip"></div>
  </div>
  <div class="toast" id="toast"></div>
  <button class="icon-btn glass back-to-top" id="backToTop" type="button" title="回到顶部" aria-label="回到顶部">
    <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
  </button>

<div class="online-badge" id="onlineBadge" style="display:none">
  <div class="online-avatars" id="onlineAvatars"></div>
  <span class="online-label" id="onlineLabel"></span>
</div>
<script src="/app.js" defer></script>
</body>
</html>
