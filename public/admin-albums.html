<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>相簿管理 · 那年今日</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#0a0a0e;color:#f5f5f7;font-family:"SF Pro Display",-apple-system,"PingFang SC",sans-serif;padding:1.5rem}
h1{font-size:1.4rem;font-weight:700;margin:0 0 1.5rem}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:1.2rem;margin-bottom:1rem}
label{display:block;font-size:.75rem;color:#8a8a8f;margin-bottom:.3rem}
input,textarea,select{width:100%;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:.55rem .75rem;color:#f5f5f7;font-size:.88rem;outline:none;margin-bottom:.8rem}
input:focus,textarea:focus{border-color:rgba(255,255,255,0.35)}
textarea{resize:vertical;min-height:70px}
button{padding:.5rem 1.1rem;border-radius:8px;border:none;cursor:pointer;font-size:.85rem;font-weight:600}
.btn-primary{background:#3a82f7;color:#fff}
.btn-danger{background:rgba(255,59,48,0.8);color:#fff;float:right}
.btn-sm{padding:.3rem .7rem;font-size:.75rem;border-radius:6px;background:rgba(255,255,255,0.1);color:#f5f5f7;margin-left:.4rem}
.album-row{display:flex;align-items:center;gap:.8rem;padding:.7rem .9rem;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:10px;margin-bottom:.5rem;cursor:pointer}
.album-thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#111;flex-shrink:0}
.album-info{flex:1;min-width:0}
.album-title{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album-meta{font-size:.7rem;color:#8a8a8f;margin-top:.15rem}
.tag{display:inline-block;padding:.1rem .5rem;border-radius:999px;font-size:.65rem;background:rgba(255,255,255,0.1);margin-right:.3rem}
.tag.private{background:rgba(255,180,0,0.2);color:#ffbb33}
.section{margin-bottom:1.5rem}
h2{font-size:1rem;font-weight:600;margin:0 0 .8rem;color:#c7c7cc}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:600px){.field-row{grid-template-columns:1fr}}
.msg{padding:.5rem .9rem;border-radius:8px;font-size:.82rem;margin-bottom:.8rem;display:none}
.msg.ok{background:rgba(52,199,89,0.18);color:#34c759;display:block}
.msg.err{background:rgba(255,59,48,0.18);color:#ff3b30;display:block}
#albums-list{min-height:40px}
.detail-panel{display:none;margin-top:1rem;padding:1rem;background:rgba(0,0,0,0.3);border-radius:10px;border:1px solid rgba(255,255,255,0.07)}
.detail-panel.open{display:block}
/* 照片选择器 */
.picker-bar{display:flex;align-items:flex-end;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.picker-bar input[type=date]{width:auto;margin-bottom:0}
.picker-bar button{margin-bottom:0}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.picker-cell{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;background:#111}
.picker-cell img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .15s}
.picker-cell:hover img{transform:scale(1.05)}
.picker-cell.selected{outline:3px solid #3a82f7;outline-offset:-3px}
.picker-cell.selected::after{content:'✓';position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:#3a82f7;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.picker-cell .pc-label{position:absolute;bottom:0;left:0;right:0;padding:2px 4px;background:rgba(0,0,0,.6);color:#ccc;font-size:.58rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.picker-status{font-size:.78rem;color:#8a8a8f;margin-top:.5rem}
.picker-actions{display:flex;align-items:center;gap:.6rem;margin-top:.6rem;flex-wrap:wrap}
.picker-actions .count{font-size:.8rem;color:#c7c7cc}
</style>
</head>
<body>
<h1>📁 相簿管理</h1>

<div class="section">
  <h2>新建相簿</h2>
  <div class="card">
    <div id="createMsg" class="msg"></div>
    <div class="field-row">
      <div>
        <label>标题 *</label>
        <input id="newTitle" placeholder="夏天的旅行" />
      </div>
      <div>
        <label>标识符 (slug) * <span style="font-weight:400;color:#8a8a8f">（英文/数字/连字符）</span></label>
        <input id="newSlug" placeholder="summer-trip" />
      </div>
    </div>
    <label>简介</label>
    <textarea id="newDesc" placeholder="可选"></textarea>
    <div class="field-row">
      <div>
        <label>是否私密</label>
        <select id="newPrivate"><option value="0">公开</option><option value="1">私密（需密码）</option></select>
      </div>
      <div>
        <label>密码（私密时必填）</label>
        <input id="newPw" type="password" placeholder="可选" />
      </div>
    </div>
    <button class="btn-primary" type="button" onclick="createAlbum()">创建</button>
  </div>
</div>

<div class="section">
  <h2>已有相簿</h2>
  <div id="albums-list"><div style="color:#8a8a8f;font-size:.85rem">加载中…</div></div>
</div>

<div id="detailPanel" class="detail-panel">
  <h2 id="dpTitle"></h2>
  <div id="dpMsg" class="msg"></div>

  <div>
    <h3 style="font-size:.85rem;font-weight:600;color:#c7c7cc;margin:0 0 .6rem">添加照片</h3>
    <div class="picker-bar">
      <div><label>开始日期</label><input type="date" id="pickFrom" /></div>
      <div><label>结束日期</label><input type="date" id="pickTo" /></div>
      <button class="btn-primary btn-sm" type="button" onclick="browsePhotos()">浏览</button>
    </div>
    <div id="pickerGrid" class="picker-grid"></div>
    <div id="pickerStatus" class="picker-status"></div>
    <div id="pickerActions" class="picker-actions" style="display:none">
      <span class="count" id="pickerCount"></span>
      <button class="btn-sm" type="button" onclick="pickerSelectAll()">全选</button>
      <button class="btn-sm" type="button" onclick="pickerDeselectAll()">取消全选</button>
      <button class="btn-primary btn-sm" type="button" onclick="addSelectedPhotos()">添加选中</button>
    </div>
  </div>

  <hr style="border:none;border-top:1px solid rgba(255,255,255,0.08);margin:1rem 0" />

  <div>
    <h3 style="font-size:.85rem;font-weight:600;color:#c7c7cc;margin:0 0 .6rem">已有照片</h3>
    <div id="dpPhotosWrap"></div>
  </div>

  <hr style="border:none;border-top:1px solid rgba(255,255,255,0.08);margin:1rem 0" />

  <details style="margin-bottom:1rem">
    <summary style="font-size:.85rem;font-weight:600;color:#8a8a8f;cursor:pointer;margin-bottom:.6rem">修改相簿信息</summary>
    <div class="field-row">
      <div><label>标题</label><input id="dpEditTitle" /></div>
      <div><label>简介</label><input id="dpEditDesc" /></div>
    </div>
    <div class="field-row">
      <div>
        <label>密码（留空不修改）</label>
        <input id="dpEditPw" type="password" placeholder="留空=不修改" />
      </div>
      <div>
        <label>是否私密</label>
        <select id="dpEditPrivate"><option value="0">公开</option><option value="1">私密</option></select>
      </div>
    </div>
    <button class="btn-primary btn-sm" type="button" onclick="saveAlbum()">保存</button>
    <button class="btn-danger btn-sm" type="button" onclick="deleteAlbum()">删除相簿</button>
  </details>
</div>

<script>
var TOKEN = new URLSearchParams(location.search).get('token') || '';
var currentSlug = null;
var pickerPhotos = [];
var selectedKeys = {};
var existingKeys = {};

function apiHeaders() {
  return { 'content-type': 'application/json', 'x-admin-token': TOKEN };
}

function showMsg(el, type, text) {
  el.className = 'msg ' + type;
  el.textContent = text;
  setTimeout(function() { el.className = 'msg'; }, 4000);
}

function loadAlbums() {
  fetch('/api/albums').then(function(r){ return r.json(); }).then(function(data) {
    var list = document.getElementById('albums-list');
    if (!data.albums.length) { list.innerHTML = '<div style="color:#8a8a8f;font-size:.85rem">还没有相簿</div>'; return; }
    list.innerHTML = data.albums.map(function(a) {
      var thumb = a.coverUrl ? '<img class="album-thumb" src="'+a.coverUrl+'" />' : '<div class="album-thumb"></div>';
      var tags = (a.isPrivate ? '<span class="tag private">🔒 私密</span>' : '<span class="tag">公开</span>');
      return '<div class="album-row" onclick="openAlbum('+JSON.stringify(a.slug)+')">' +
        thumb +
        '<div class="album-info"><div class="album-title">'+a.title+'</div>' +
        '<div class="album-meta">'+tags+' '+a.slug+'</div></div>' +
        '</div>';
    }).join('');
  }).catch(function(){ document.getElementById('albums-list').innerHTML = '<div style="color:#ff3b30">加载失败</div>'; });
}

function toSlug(str) {
  return str.toLowerCase()
    .replace(/[\s_]+/g, '-')
    .replace(/[^a-z0-9-]/g, '')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '');
}

(function() {
  var titleEl = document.getElementById('newTitle');
  var slugEl = document.getElementById('newSlug');
  titleEl.addEventListener('input', function() {
    if (!slugEl._touched) slugEl.value = toSlug(titleEl.value);
  });
  slugEl.addEventListener('input', function() {
    slugEl._touched = slugEl.value !== '';
  });
  slugEl.addEventListener('blur', function() {
    var clean = toSlug(slugEl.value);
    if (clean !== slugEl.value) slugEl.value = clean;
    slugEl._touched = clean !== '';
  });
})();

function createAlbum() {
  var title = document.getElementById('newTitle').value.trim();
  var rawSlug = document.getElementById('newSlug').value.trim();
  var slug = toSlug(rawSlug);
  var desc = document.getElementById('newDesc').value.trim();
  var isPrivate = document.getElementById('newPrivate').value === '1';
  var pw = document.getElementById('newPw').value;
  var msg = document.getElementById('createMsg');
  if (!title) { showMsg(msg, 'err', '请填写相簿标题'); return; }
  if (!slug) { showMsg(msg, 'err', 'slug 只能含英文字母、数字和连字符，请改用英文'); return; }
  document.getElementById('newSlug').value = slug;
  fetch('/api/albums', {
    method: 'POST',
    headers: apiHeaders(),
    body: JSON.stringify({ title: title, slug: slug, description: desc, is_private: isPrivate, password: pw })
  }).then(function(r){ return r.json(); }).then(function(d) {
    if (d.ok) {
      showMsg(msg, 'ok', '创建成功！');
      document.getElementById('newTitle').value = '';
      document.getElementById('newSlug').value = '';
      document.getElementById('newSlug')._touched = false;
      document.getElementById('newDesc').value = '';
      document.getElementById('newPw').value = '';
      loadAlbums();
    } else {
      showMsg(msg, 'err', d.error || '创建失败');
    }
  }).catch(function() { showMsg(msg, 'err', '网络错误，请重试'); });
}

function openAlbum(slug) {
  currentSlug = slug;
  pickerPhotos = [];
  selectedKeys = {};
  existingKeys = {};
  document.getElementById('pickerGrid').innerHTML = '';
  document.getElementById('pickerStatus').textContent = '';
  document.getElementById('pickerActions').style.display = 'none';

  var panel = document.getElementById('detailPanel');
  panel.classList.add('open');
  document.getElementById('dpTitle').textContent = '编辑：' + slug;
  document.getElementById('dpMsg').className = 'msg';
  document.getElementById('dpPhotosWrap').innerHTML = '<div style="color:#8a8a8f;font-size:.82rem">加载照片列表…</div>';

  fetch('/api/albums/' + slug, { headers: { 'x-admin-token': TOKEN } })
    .then(function(r){ return r.json(); })
    .then(function(d) {
      document.getElementById('dpEditTitle').value = d.title || '';
      document.getElementById('dpEditDesc').value = d.description || '';
      document.getElementById('dpEditPrivate').value = d.isPrivate ? '1' : '0';
      var photos = d.photos || [];
      photos.forEach(function(p) { existingKeys[p.key] = true; });
      renderPhotos(photos);
    })
    .catch(function() { document.getElementById('dpPhotosWrap').innerHTML = '<div style="color:#ff3b30">加载失败</div>'; });

  panel.scrollIntoView({ behavior: 'smooth' });
}

function renderPhotos(photos) {
  var wrap = document.getElementById('dpPhotosWrap');
  if (!photos.length) { wrap.innerHTML = '<div style="color:#8a8a8f;font-size:.82rem">暂无照片</div>'; return; }
  wrap.innerHTML = '<div style="font-size:.8rem;color:#8a8a8f;margin-bottom:.5rem">' + photos.length + ' 张照片</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
    photos.map(function(p) {
      return '<div style="position:relative;width:72px;height:72px">' +
        '<img src="/thumb/'+encodeURIComponent(p.key)+'?w=144&q=70" style="width:72px;height:72px;object-fit:cover;border-radius:6px;background:#111" />' +
        '<button type="button" onclick="removePhoto('+JSON.stringify(p.key)+')" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center">×</button>' +
        '</div>';
    }).join('') + '</div>';
}

function removePhoto(key) {
  if (!currentSlug || !confirm('从相簿中移除这张照片？')) return;
  fetch('/api/albums/' + currentSlug + '/photos', {
    method: 'DELETE',
    headers: apiHeaders(),
    body: JSON.stringify({ key: key })
  }).then(function(r){ return r.json(); }).then(function(d) {
    if (d.ok) openAlbum(currentSlug);
  });
}

function saveAlbum() {
  if (!currentSlug) return;
  var body = {
    title: document.getElementById('dpEditTitle').value.trim(),
    description: document.getElementById('dpEditDesc').value.trim(),
    is_private: document.getElementById('dpEditPrivate').value === '1',
  };
  var pw = document.getElementById('dpEditPw').value;
  if (pw) body.password = pw;
  var msg = document.getElementById('dpMsg');
  fetch('/api/albums/' + currentSlug, { method: 'PATCH', headers: apiHeaders(), body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d.ok) { showMsg(msg, 'ok', '已保存'); loadAlbums(); } else showMsg(msg, 'err', d.error || '失败'); })
    .catch(function(){ showMsg(msg, 'err', '请求失败'); });
}

function deleteAlbum() {
  if (!currentSlug || !confirm('确认删除相簿「' + currentSlug + '」？照片不会被删除，只是移出相簿。')) return;
  fetch('/api/albums/' + currentSlug, { method: 'DELETE', headers: apiHeaders() })
    .then(function(r){ return r.json(); })
    .then(function(d) {
      if (d.ok) {
        document.getElementById('detailPanel').classList.remove('open');
        currentSlug = null;
        loadAlbums();
      }
    });
}

// ── 照片选择器 ──────────────────────────────────────────────────────────────────
function browsePhotos() {
  var from = document.getElementById('pickFrom').value;
  var to = document.getElementById('pickTo').value;
  var msg = document.getElementById('dpMsg');
  if (!from || !to) { showMsg(msg, 'err', '请选择开始和结束日期'); return; }
  if (from > to) { var tmp = from; from = to; to = tmp; document.getElementById('pickFrom').value = from; document.getElementById('pickTo').value = to; }

  pickerPhotos = [];
  selectedKeys = {};
  document.getElementById('pickerGrid').innerHTML = '<div style="color:#8a8a8f;font-size:.82rem;grid-column:1/-1">加载中…</div>';
  document.getElementById('pickerActions').style.display = 'none';
  document.getElementById('pickerStatus').textContent = '';

  loadPickerPage(from, to, 0);
}

function loadPickerPage(from, to, offset) {
  fetch('/api/album-browse?from=' + from + '&to=' + to + '&offset=' + offset + '&limit=200')
    .then(function(r){ return r.json(); })
    .then(function(data) {
      pickerPhotos = pickerPhotos.concat(data.photos);
      if (data.hasMore) {
        loadPickerPage(from, to, offset + data.limit);
      } else {
        renderPicker();
      }
    })
    .catch(function() {
      showMsg(document.getElementById('dpMsg'), 'err', '浏览照片失败');
    });
}

function renderPicker() {
  var grid = document.getElementById('pickerGrid');
  if (!pickerPhotos.length) {
    grid.innerHTML = '<div style="color:#8a8a8f;font-size:.82rem;grid-column:1/-1">该日期范围内没有照片</div>';
    document.getElementById('pickerActions').style.display = 'none';
    document.getElementById('pickerStatus').textContent = '';
    return;
  }

  var newCount = 0;
  grid.innerHTML = pickerPhotos.map(function(p, i) {
    var inAlbum = existingKeys[p.key];
    if (!inAlbum) newCount++;
    var label = p.year + '/' + p.month + '/' + p.day;
    if (p.caption) label = p.caption.slice(0, 20);
    else if (p.place) label = p.place;
    return '<div class="picker-cell' + (selectedKeys[p.key] ? ' selected' : '') + (inAlbum ? ' in-album' : '') + '" data-idx="' + i + '" onclick="togglePick(this,' + i + ')" title="' + p.key.replace(/"/g, '&quot;') + '">' +
      '<img src="' + p.thumb.replace(/"/g, '&quot;') + '" loading="lazy" />' +
      (inAlbum ? '<div class="pc-label" style="background:rgba(58,130,247,.7);color:#fff">已在相簿</div>' : '<div class="pc-label">' + label + '</div>') +
      '</div>';
  }).join('');

  document.getElementById('pickerStatus').textContent = '共 ' + pickerPhotos.length + ' 张照片，其中 ' + (pickerPhotos.length - newCount) + ' 张已在相簿';
  document.getElementById('pickerActions').style.display = 'flex';
  updatePickerCount();
}

function togglePick(el, idx) {
  var key = pickerPhotos[idx].key;
  if (existingKeys[key]) return;
  if (selectedKeys[key]) {
    delete selectedKeys[key];
    el.classList.remove('selected');
  } else {
    selectedKeys[key] = true;
    el.classList.add('selected');
  }
  updatePickerCount();
}

function pickerSelectAll() {
  pickerPhotos.forEach(function(p, i) {
    if (!existingKeys[p.key]) {
      selectedKeys[p.key] = true;
      var cell = document.querySelector('.picker-cell[data-idx="'+i+'"]');
      if (cell) cell.classList.add('selected');
    }
  });
  updatePickerCount();
}

function pickerDeselectAll() {
  selectedKeys = {};
  document.querySelectorAll('.picker-cell.selected').forEach(function(el) { el.classList.remove('selected'); });
  updatePickerCount();
}

function updatePickerCount() {
  var count = Object.keys(selectedKeys).length;
  document.getElementById('pickerCount').textContent = count ? '已选 ' + count + ' 张' : '未选择';
}

function addSelectedPhotos() {
  if (!currentSlug) return;
  var keys = Object.keys(selectedKeys);
  var msg = document.getElementById('dpMsg');
  if (!keys.length) { showMsg(msg, 'err', '请先选择要添加的照片'); return; }
  fetch('/api/albums/' + currentSlug + '/photos', {
    method: 'POST',
    headers: apiHeaders(),
    body: JSON.stringify({ keys: keys })
  }).then(function(r){ return r.json(); }).then(function(d) {
    if (d.ok) {
      showMsg(msg, 'ok', '已添加 ' + d.added + ' 张');
      openAlbum(currentSlug);
    } else {
      showMsg(msg, 'err', d.error || '添加失败');
    }
  }).catch(function() { showMsg(msg, 'err', '网络错误'); });
}

document.addEventListener('DOMContentLoaded', loadAlbums);
</script>
</body>
</html>
