<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>足迹 · 那年今日</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<link rel="stylesheet" href="/map.css" />
</head>
<body>
  <a class="back-btn" href="/" title="回到回忆墙">
    <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  </a>
  <div id="map"></div>
  <div class="map-empty" id="mapEmpty">还没有带定位信息的照片<br />等后台任务慢慢解析，或跑一次 /admin/locate-photos</div>

<script>
// map.js 依赖 window.MAPBOX_TOKEN 同步就绪，所以先取到 token 再动态加载它
fetch('/api/map-config')
  .then(function (r) { return r.json(); })
  .then(function (cfg) {
    window.MAPBOX_TOKEN = cfg.mapboxToken || '';
    var s = document.createElement('script');
    s.src = '/map.js';
    document.body.appendChild(s);
  });
</script>
</body>
</html>
